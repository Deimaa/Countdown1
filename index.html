<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Spring Inspiration logo — top right -->
    <div id="spring-logo">
      <img src="Logos/SPRINGLOGO.png" alt="Spring Inspiration" />
    </div>

    <!-- Sponsor logos — left side, evenly spread top to bottom -->
    <div id="sponsors">
      <div class="logo-box">
        <img src="Logos/bondisans.png" alt="Bondi Sands" />
      </div>
      <div class="logo-box">
        <img src="Logos/fcgruppen.png" alt="FC Gruppen" />
      </div>
      <div class="logo-box artdeco-box">
        <img src="Logos/Medium PNG-AD Logo black.png" alt="Art Deco" />
      </div>
    </div>

    <!-- Timer — dead center -->
    <div id="timer-wrap">
      <div id="timer">30:00</div>
      <div id="status"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
